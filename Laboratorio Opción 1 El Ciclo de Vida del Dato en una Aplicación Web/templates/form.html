<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Nueva Incidencia</title>
</head>
<body class="container mt-5">
    <h2>📝 Nueva Incidencia</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category=='error' else 'success' }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" name="titulo" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Descripción <small>(mínimo 10 caracteres)</small></label>
            <textarea class="form-control" name="descripcion" rows="4" required>{{ form.descripcion if form else '' }}</textarea>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select class="form-select" name="categoria" required>
                <option value="">Seleccionar...</option>
                <option value="A" {% if form and form.categoria == 'A' %}selected{% endif %}>🚨 A - Crítica</option>
                <option value="B" {% if form and form.categoria == 'B' %}selected{% endif %}>⚠️ B - Leve</option>
            </select>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
        </div>
        
        <button type="submit" class="btn btn-primary">💾 Registrar</button>
        <a href="/" class="btn btn-secondary">← Volver</a>
    </form>
</body>
</html>
