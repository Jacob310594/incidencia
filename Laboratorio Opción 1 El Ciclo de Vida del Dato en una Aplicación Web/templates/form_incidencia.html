<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Registro de Incidencia</title>
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">📝 Registrar Nueva Incidencia</h3>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category=='error' else 'success' }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('form_incidencia') }}" method="POST">
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título de la Incidencia</label>
                            <input type="text" class="form-control" id="titulo" name="titulo" required value="{{ form_data.titulo if form_data else '' }}" placeholder="Ej: Error de conexión">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" name="email" required value="{{ form_data.email if form_data else '' }}" placeholder="usuario@ejemplo.com">
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label">Prioridad / Categoría</label>
                            <select class="form-select" id="categoria" name="categoria" required>
                                <option value="" selected disabled>Seleccione una opción...</option>
                                <option value="A" {{ 'selected' if form_data and form_data.categoria == 'A' else '' }}>🚨 Crítica (A) - Operación Afectada</option>
                                <option value="B" {{ 'selected' if form_data and form_data.categoria == 'B' else '' }}>⚠️ Leve (B) - Sugerencias o fallos menores</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción <small class="text-muted">(Mínimo 10 caracteres)</small></label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="4" required minlength="10" placeholder="Detalla lo ocurrido para evitar ruido semántico...">{{ form_data.descripcion if form_data else '' }}</textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4">Guardar Incidencia</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const descripcion = document.getElementById('descripcion').value.trim();
            if (descripcion.length < 10) {
                e.preventDefault();
                alert('La descripción debe tener al menos 10 caracteres.');
            }
        });
    </script>
</body>
</html>
